name: App Probe (콜드 부팅 관찰)

# 라이브 앱이 '언제 잠드는지 / push마다 재시작되는지'를 알아보기 위한 관찰용이다.
# 현황.md 9번의 두 가정을 확인하는 게 목적이고, 확인이 끝나면 지워도 된다.
#
# ⚠️ 레포에 아무것도 커밋하지 않는다. 결과는 Actions 실행 로그와 요약에만 남는다.
#    (데이터 로봇들과 달리 git push가 없으므로 앱을 재배포시키지 않는다 —
#     관찰 행위가 관찰 대상을 바꾸지 않도록)
#
# 읽는 법: Actions 탭 → 이 워크플로 → 각 실행의 Summary
#   ttfb 8초 이상   = 잠들어 있다가 깨어남 (콜드)
#   ttfb 3초 미만   = 깨어 있었음 (웜)
#
# 관찰 설계 (2단계)
#   1단계 — 지금. 2시간마다 찍는다.
#           * 한 번이라도 콜드가 잡히면 → 2시간 간격 HTTP 요청으로는 잠드는 걸 막지 못한다.
#             즉 "로봇이 ping해서 깨워두기"는 효과가 없다는 뜻이다. 결론 남
#           * 일주일 내내 웜이면 → 잠들지 않고 있다는 뜻인데, 이 워크플로 자신이
#             깨워두는 것인지 로봇 push 때문인지 아직 구분되지 않는다 → 2단계로 간다
#   2단계 — 이 워크플로를 Actions 탭에서 '사용 중지'하고 2~3일 둔 뒤,
#           수동 실행(workflow_dispatch)으로 한 번 찍는다.
#           * 콜드면 → 1단계의 ping이 깨워두고 있었다 (= ping 방식이 통한다)
#           * 웜이면  → 로봇 push가 앱을 계속 살아있게 만든다 (= ping이 불필요)

on:
  schedule:
    - cron: '7 */2 * * *'   # 2시간마다 (정각을 피해 7분에 — 데이터 로봇과 겹치지 않게)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 앱 응답 시간 측정
        env:
          APP_URL: https://myquantumjump-bccuvb2zu4yacfnqd9exjc.streamlit.app
        run: |
          # ⚠️ 이 스텝은 bash -e (errexit)로 돈다. 실패 종료코드를 '값'으로 쓰는 곳은
          #    반드시 if 로 감싼다 — `awk ... && VAR=x` 처럼 쓰면 awk가 1을 낼 때
          #    그 줄 전체가 실패로 잡혀 스크립트가 죽는다. (실제로 한 번 죽었다)
          set -u
          # -L 로 로그인 리다이렉트를 따라간다. 쿠키 없이는 auth 루프에 걸리므로 쿠키 항아리를 쓴다.
          JAR=$(mktemp)
          OUT=$(curl -s -o /dev/null \
            -c "$JAR" -b "$JAR" -L --max-time 120 \
            -w '%{http_code} %{time_starttransfer} %{time_total}' \
            "$APP_URL") || OUT="000 999 999"
          read -r CODE TTFB TOTAL <<< "$OUT"

          # 8초 이상이면 슬립에서 깨어난 것으로 본다 (실측 콜드 15~18초, 웜 1~2초)
          STATE="웜 (깨어 있었음)"
          if awk "BEGIN{exit !($TTFB >= 8)}"; then
            STATE="🥶 콜드 (잠들어 있었음)"
          fi
          if [ "$CODE" != "200" ]; then
            STATE="⚠️ 응답 이상 (http=$CODE)"
          fi

          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          LINE="| $NOW | $CODE | ${TTFB}s | ${TOTAL}s | $STATE |"

          {
            echo "### 앱 응답 관찰"
            echo ""
            echo "| 시각 | HTTP | TTFB | 총 | 판정 |"
            echo "|---|---|---|---|---|"
            echo "$LINE"
            echo ""
            echo "판정 기준: TTFB 8초 이상 = 콜드. 실측값은 콜드 15~18초 / 웜 1~2초라 8초는 넉넉한 경계다."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$LINE"
          # 응답이 이상해도 관찰은 실패로 만들지 않는다 (알림만 남기고 계속 돈다)
          exit 0
