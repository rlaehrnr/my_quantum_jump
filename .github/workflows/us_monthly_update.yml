name: US Monthly Archive

on:
  schedule:
    # KST 매월 1일 06/07/08시 반복 시도. 정각 혼잡을 피하고 09시 전 반영 목표.
    - cron: '31 21,22,23 28-31 * *'
  workflow_dispatch:

jobs:
  generate-us-archive:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    
    steps:
    - name: 1. 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 2. 1일 체크 로직 (예약 실행은 매월 1일만 / 수동 실행은 항상 허용)
      id: date_check
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "수동 실행(workflow_dispatch): 날짜 가드 없이 진행합니다."
          echo "run_job=true" >> $GITHUB_ENV
        elif [ "$(date +'%d')" != "01" ]; then
          echo "오늘은 매월 1일이 아닙니다. 스킵합니다."
          echo "run_job=false" >> $GITHUB_ENV
        else
          echo "run_job=true" >> $GITHUB_ENV
        fi

    - name: 3. 파이썬 환경 세팅
      if: env.run_job == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 4. 라이브러리 설치
      if: env.run_job == 'true'
      run: |
        python -m pip install --upgrade pip
        # pyarrow: 갱신 끝에 '확정된 지난 달' 합본(parquet)을 만드는 데 쓴다 (utils/archive_store.py)
        pip install pandas finance-datareader requests pyarrow

    - name: 5. 🇺🇸 미국 월간 아카이브 생성 스크립트 실행
      if: env.run_job == 'true'
      run: python update_monthly_us.py

    - name: 6. 깃허브에 덮어쓰기
      if: env.run_job == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        if git diff --cached --quiet; then
          echo "변경 없음 — 커밋 건너뜀"
          exit 0
        fi
        git commit -m "🤖 [US] 매월 1일 미국 모멘텀 아카이브 자동 생성 완료"
        for attempt in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            exit 0
          fi
          # 실제 파일 충돌은 덮어쓰지 않고 실패로 알린다.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
            exit 1
          fi
          sleep 5
        done
        echo "::error::원격 반영 5회 실패 — 다음 예약 또는 수동 재실행 필요"
        exit 1
