name: Snowball Data Update (Daily)

on:
  schedule:
    # 매일 KST 07:01. 월초에는 06:01/08:01 추가 시도 (미국 마감 후).
    - cron: '1 22 * * *'
    - cron: '1 21,23 28-31,1,2 * *'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  update-snowball:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
    - name: 1. 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy finance-datareader yfinance requests beautifulsoup4 lxml openpyxl

    - name: 4. 스노우볼 데이터 업데이트 스크립트 실행
      run: python update_snowball.py

    - name: 5. 깃허브에 변경사항 커밋 & 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/snowball/
        if git diff --cached --quiet; then
          echo "변경 없음 — 커밋 건너뜀"
          exit 0
        fi
        git commit -m "🤖 [Snowball] 데이터 자동 갱신 (월말 자료·일별 재조정 반영)"
        for attempt in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            exit 0
          fi
          # 실제 파일 충돌은 덮어쓰지 않고 실패로 알린다.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
            exit 1
          fi
          sleep 5
        done
        echo "::error::원격 반영 5회 실패 — 다음 예약 또는 수동 재실행 필요"
        exit 1
