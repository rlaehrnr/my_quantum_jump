name: Snowball KR Monthly Update

on:
  schedule:
    # KST 월초 1~3일 06:21/07:21/08:21. 데이터 지연·실패 시 자동 재시도.
    - cron: '21 21,22,23 28-31,1,2 * *'
    # 평일 KST 17:21. 국내 장 마감 일봉만 갱신한다.
    - cron: '21 8 * * 1-5'
  workflow_dispatch:
    inputs:
      daily_only:
        description: 일봉만 갱신
        type: boolean
        default: false

jobs:
  update-snowball-kr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul

    steps:
    - name: 수집 범위 확인
      id: date_check
      run: |
        if [ "${{ github.event.schedule }}" = '21 8 * * 1-5' ] || [ "${{ inputs.daily_only }}" = "true" ]; then
          echo "run_job=true" >> "$GITHUB_ENV"
          echo "daily_only=true" >> "$GITHUB_ENV"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%d)" -le 3 ]; then
          echo "run_job=true" >> "$GITHUB_ENV"
          echo "daily_only=false" >> "$GITHUB_ENV"
        else
          echo "run_job=false" >> "$GITHUB_ENV"
        fi

    - name: 1. 저장소 코드 불러오기
      if: env.run_job == 'true'
      uses: actions/checkout@v3

    - name: 2. 파이썬 환경 세팅
      if: env.run_job == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 라이브러리 설치
      if: env.run_job == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install pandas finance-datareader yfinance requests

    - name: 4. 🇰🇷 코 삼성(국내 ETF) 데이터 수집
      if: env.run_job == 'true'
      run: |
        if [ "$daily_only" = "true" ]; then
          python update_snowball_kr.py --daily-only
        else
          python update_snowball_kr.py
        fi

    - name: 5. 깃허브에 커밋
      if: env.run_job == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/snowball_kr/
        if git diff --cached --quiet; then
          echo "변경 없음 — 커밋 건너뜀"
          exit 0
        fi
        git commit -m "🤖 [Snowball KR] 국내 ETF 데이터 자동 업데이트"
        for attempt in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            exit 0
          fi
          # 실제 파일 충돌은 덮어쓰지 않고 실패로 알린다.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
            exit 1
          fi
          sleep 5
        done
        echo "::error::원격 반영 5회 실패 — 다음 예약 또는 수동 재실행 필요"
        exit 1
