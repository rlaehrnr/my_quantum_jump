name: Seasonality Monthly

on:
  schedule:
    # cron은 UTC. 21:30 UTC = 한국시간 다음날 06:30
    # 말일이 28~31로 달마다 다르므로 모두 트리거하고 아래에서 "1일"인지 검사
    - cron: '30 21 28-31 * *'
  workflow_dispatch:

jobs:
  update-seasonality:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
    - name: 1. 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 2. 1일 체크 (예약 실행은 매월 1일만 / 수동 실행은 항상 허용)
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "수동 실행: 날짜 가드 없이 진행합니다."
          echo "run_job=true" >> $GITHUB_ENV
        elif [ "$(date +'%d')" != "01" ]; then
          echo "오늘은 매월 1일이 아닙니다. 스킵합니다."
          echo "run_job=false" >> $GITHUB_ENV
        else
          echo "run_job=true" >> $GITHUB_ENV
        fi

    - name: 3. 파이썬 환경 세팅
      if: env.run_job == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 4. 라이브러리 설치
      if: env.run_job == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install "pandas<3" finance-datareader requests

    - name: 5. 📅 계절성 월간 데이터 갱신
      if: env.run_job == 'true'
      run: python update_seasonality.py

    - name: 6. 깃허브에 반영
      if: env.run_job == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/seasonality_monthly.csv
        git commit -m "🤖 [계절성] 월간 수익률 자동 갱신" || echo "No changes to commit"
        git pull origin main --rebase
        git push
