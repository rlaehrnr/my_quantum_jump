name: KR Monthly Archive

on:
  schedule:
    # KST 매월 1일 06/07/08시 반복 시도. 정각 혼잡을 피하고 09시 전 반영 목표.
    - cron: '11 21,22,23 28-31 * *'
  workflow_dispatch:

jobs:
  # 한국시간 기준 오늘이 1일일 때만 통과 (= 전월 말일 밤에 뜬 실행만)
  check-date:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "$(date +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 한국시간 1일 → 아카이브 생성 진행"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 말일 트리거가 아님 → 건너뜀"
          fi

  generate-kr-archive:
    needs: check-date
    if: needs.check-date.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
    - name: 1. 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        # pyarrow: 갱신 끝에 '확정된 지난 달' 합본(parquet)을 만드는 데 쓴다 (utils/archive_store.py)
        pip install pandas finance-datareader requests pyarrow

    - name: 4. 🇰🇷 한국 월간 아카이브 생성 스크립트 실행
      run: python update_monthly_kr.py

    - name: 5. 깃허브에 덮어쓰기
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        if git diff --cached --quiet; then
          echo "변경 없음 — 커밋 건너뜀"
          exit 0
        fi
        git commit -m "🤖 [KR] 매월 1일 한국 모멘텀 아카이브 자동 생성 완료"
        for attempt in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            exit 0
          fi
          # 실제 파일 충돌은 덮어쓰지 않고 실패로 알린다.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort
            exit 1
          fi
          sleep 5
        done
        echo "::error::원격 반영 5회 실패 — 다음 예약 또는 수동 재실행 필요"
        exit 1
